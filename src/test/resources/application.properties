# ===============================
# = TEST DATASOURCE CONFIGURATION (H2)
# ===============================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ===============================
# = JPA CONFIGURATION
# ===============================
spring.jpa.hibernate.ddl-auto=update

# ===============================
# = FLYWAY CONFIGURATION (Disabled for tests)
# ===============================
spring.flyway.enabled=false

# ===============================
# = REDIS CONFIGURATION (Disabled for tests)
# ===============================
spring.data.redis.repositories.enabled=false

# ===============================
# = APP CONFIGURATION
# ===============================
app.otp-duration=1
app.jwt.jwt-secrete=test-jwt-secret-key-for-brillo-mall-application-with-long-enough-string
app.default-business-logo-url=http://example.com/logo.png