# ===============================
# = TEST DATASOURCE CONFIGURATION (H2)
# ===============================
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ===============================
# = JPA CONFIGURATION
# ===============================
spring.jpa.hibernate.ddl-auto=validate

# ===============================
# = FLYWAY CONFIGURATION
# ===============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration-h2

# ===============================
# = REDIS CONFIGURATION (Disabled for tests)
# ===============================
spring.data.redis.repositories.enabled=false

# ===============================
# = APP CONFIGURATION
# ===============================
spring.task.scheduling.enabled=false
app.otp-duration=1
app.jwt.jwt-secrete=test-jwt-secret-key-for-brillo-mall-application-with-long-enough-string
app.default-business-logo-url=http://example.com/logo.png
payment.processor.default=paystack
paystack.secret.key=test-paystack-secret
paystack.api.base-url=https://api.paystack.co

# ===============================
# = CLOUDINARY CONFIGURATION
# ===============================
cloudinary.cloud-name=your_cloud_name
cloudinary.api-key=your_api_key
cloudinary.api-secret=your_api_secret
