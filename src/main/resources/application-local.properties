# ===============================
# = DATASOURCE CONFIGURATION
# ===============================
spring.datasource.url=jdbc:mysql://${DB_HOST}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# = FLYWAY CONFIGURATION
# ===============================
spring.flyway.baseline-on-migrate=true
spring.flyway.enabled=false
spring.flyway.user=${spring.datasource.url}
spring.flyway.password=${spring.datasource.password}
spring.flyway.baseline-description=init
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# ===============================
# = JPA CONFIGURATION
# ===============================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# ===============================
# = REDIS CONFIGURATION
# ===============================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6381}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=0
spring.data.redis.timeout=60000

spring.data.redis.lettuce.pool.max-active=10
spring.data.redis.lettuce.pool.max-idle=5
spring.data.redis.lettuce.pool.min-idle=1
spring.data.redis.lettuce.pool.max-wait=10000

# ===============================
# = APP CONFIGURATION
# ===============================
app.jwt.jwt-secrete=${JWT_SECRETE}
app.otp-duration=${OTP_DURATION}

spring.jackson.time-zone=Africa/Lagos